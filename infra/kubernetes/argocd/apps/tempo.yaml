apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo-distributed
      targetRevision: "1.19.0"
      helm:
        valueFiles:
          - $values/infra/kubernetes/addons/observability/tempo/values.yaml
    - repoURL: git@github.com:infraxdev/bcea-reglementations-rag.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
