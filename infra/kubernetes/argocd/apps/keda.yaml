apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.16.0"
      helm:
        valueFiles:
          - $values/infra/kubernetes/addons/keda/values.yaml
    - repoURL: git@github.com:infraxdev/bcea-reglementations-rag.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
