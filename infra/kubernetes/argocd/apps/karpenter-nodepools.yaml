apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:infraxdev/bcea-reglementations-rag.git
    targetRevision: main
    path: infra/kubernetes/addons/karpenter/nodepools/overlays/ENVIRONMENT
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
