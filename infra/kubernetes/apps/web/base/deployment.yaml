# Static Next.js export served by nginx (web/Dockerfile, docs/aws-architecture.md §5).
# nginx proxies /api/* to the `api` Service, so the browser only ever talks to one origin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bceao-rag
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false # serves static files; never talks to the K8s API
      # Shares the api node pool: tiny footprint, and it sits on the same request path.
      nodeSelector:
        bceao.io/pool: api
      tolerations:
        - key: bceao.io/pool
          operator: Equal
          value: api
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginxinc/nginx-unprivileged
      containers:
        - name: web
          image: REPLACE_WITH_WEB_ECR_IMAGE_URI # set by CI: kustomize edit set image (see .github/workflows/cd-web.yaml)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://api # the api Service in this namespace (port 80)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
