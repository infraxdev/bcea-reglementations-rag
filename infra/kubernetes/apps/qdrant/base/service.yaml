apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: bceao-rag
spec:
  clusterIP: None # headless — StatefulSet pods are addressed by their stable identity, not load-balanced
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
    - name: grpc
      port: 6334
