apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: bceao-rag
  # No AWS permissions needed — EBS access is node-level via the EBS CSI driver's own
  # IRSA role (infra/terraform/modules/eks/main.tf's ebs_csi_irsa), not this pod's.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-backup
  namespace: bceao-rag
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_OUTPUT_irsa_role_arns.qdrant_backup
