apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: bceao-rag
spec:
  template:
    spec:
      containers:
        - name: qdrant
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        resources:
          requests:
            storage: 30Gi
