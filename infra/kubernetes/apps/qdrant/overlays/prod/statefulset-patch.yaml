apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: bceao-rag
spec:
  template:
    spec:
      containers:
        - name: qdrant
          resources:
            requests: { cpu: "2", memory: 8Gi }
            limits: { memory: 16Gi }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        resources:
          requests:
            storage: 250Gi
