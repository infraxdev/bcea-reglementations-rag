apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: bceao-rag
spec:
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: bceao-rag/staging/OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: bceao-rag/staging/ANTHROPIC_API_KEY
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: bceao-rag/staging/QDRANT_API_KEY
