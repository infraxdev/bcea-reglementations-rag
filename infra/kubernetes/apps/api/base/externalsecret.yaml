apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: bceao-rag
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: bceao-rag/ENVIRONMENT/OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: bceao-rag/ENVIRONMENT/ANTHROPIC_API_KEY
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: bceao-rag/ENVIRONMENT/QDRANT_API_KEY
