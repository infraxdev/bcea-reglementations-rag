apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bceao-rag
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2 # /query is stateless (app/api/query.py) — safe to run >1 replica with no session affinity
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      nodeSelector:
        bceao.io/pool: api
      tolerations:
        - key: bceao.io/pool
          operator: Equal
          value: api
          effect: NoSchedule
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE_URI # set by CI: kustomize edit set image (see .github/workflows/cd.yaml)
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
