# helm repo add eks https://aws.github.io/eks-charts
# helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system -f values.yaml
#
# Provisions the ALB behind the Ingress in infra/kubernetes/apps/ingress/
# (docs/aws-architecture.md §2). WAFv2 attaches via that Ingress's own
# alb.ingress.kubernetes.io/wafv2-acl-arn annotation, not here.

clusterName: bceao-rag-ENVIRONMENT # replace: dev | staging | prod
region: eu-west-3
vpcId: REPLACE_WITH_TERRAFORM_OUTPUT_vpc_id

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_OUTPUT_irsa_role_arns.lb_controller

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Runs on the `system` managed node group (untainted) alongside the other cluster
# add-ons — docs/aws-architecture.md §2.
nodeSelector:
  bceao.io/pool: system
