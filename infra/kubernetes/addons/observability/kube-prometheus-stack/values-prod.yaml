# Layered on top of values.yaml for prod only: helm upgrade ... -f values.yaml -f values-prod.yaml
prometheus:
  prometheusSpec:
    retention: 30d
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 150Gi

alertmanager:
  alertmanagerSpec:
    replicas: 3

grafana:
  replicas: 2
