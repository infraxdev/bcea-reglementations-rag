# Qdrant StatefulSet (docs/aws-architecture.md §2). On-demand, memory optimized, and
# deliberately *not* aggressively consolidated — each pod is bound to an AZ-pinned EBS
# PVC, so churning this node for a bin-packing gain is a bad trade versus Qdrant's own
# stability.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: qdrant
spec:
  template:
    metadata:
      labels:
        bceao.io/pool: qdrant
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      taints:
        - key: bceao.io/pool
          value: qdrant
          effect: NoSchedule
  limits:
    cpu: "16"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1h
