# Optional self-hosted Ollama pool — Phase 3, docs/aws-architecture.md §2/§12. Zero
# nodes exist until something actually requests this taint's toleration (i.e. until the
# Ollama Deployment is deployed at all), and Karpenter removes them again once idle —
# by far the most expensive line item in §11's cost table if left always-on, so it's
# deliberately scale-to-zero rather than a standing node group.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: llm-gpu
spec:
  template:
    metadata:
      labels:
        bceao.io/pool: llm-gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-accelerated
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      taints:
        - key: bceao.io/pool
          value: llm-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
  limits:
    cpu: "16"
    memory: 64Gi
    nvidia.com/gpu: "2"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
