# Applied once (any namespace can reference a ClusterSecretStore) after the
# external-secrets Helm release is up. See infra/kubernetes/apps/api/base/
# externalsecret.yaml and apps/worker/base/externalsecret.yaml for the consumers.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
