# Local SQS (ElasticMQ) for compose.yml: same queue layout as
# infra/terraform/modules/queues (a jobs queue + DLQ per job type, 3 receives before
# the DLQ). Queue URLs: http://elasticmq:9324/000000000000/<name>
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  crawl-jobs-dlq {}
  ingest-jobs-dlq {}

  crawl-jobs {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue {
      name = "crawl-jobs-dlq"
      maxReceiveCount = 3
    }
  }

  ingest-jobs {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue {
      name = "ingest-jobs-dlq"
      maxReceiveCount = 3
    }
  }
}
