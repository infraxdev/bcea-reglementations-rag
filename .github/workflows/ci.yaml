name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check app/
      # No tests/ directory exists yet (TODO) — this step is a no-op until one does,
      # rather than failing CI on pytest's "no tests collected" exit code.
      - name: Test
        run: |
          if [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            pytest
          else
            echo "No tests found under tests/ — skipping."
          fi

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Build + scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # make the image visible to the local Docker daemon for Trivy
          tags: bceao-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: bceao-rag:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  docker-web:
    name: Build + scan web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          load: true
          tags: bceao-rag-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: bceao-rag-web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
